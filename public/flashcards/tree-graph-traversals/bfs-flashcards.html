<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SynaptiQ | BFS Flashcards</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" id="MathJax-script" async></script>
<style>
  :root {
    --bg: #fdf2f5;
    --bg2: #fce8ee;
    --bg3: #f5d5de;
    --surface: #ffffff;
    --surface2: #fce8ee;
    --border: rgba(123,45,80,0.08);
    --border2: rgba(123,45,80,0.15);
    --accent: #7b2d50;
    --accent2: #a13d63;
    --accent3: #8b3a5e;
    --accent-light: #d4869e;
    --accent-glow: rgba(123,45,80,0.08);
    --accent-glow2: rgba(123,45,80,0.12);
    --green: #43a047;
    --green-dim: rgba(67,160,71,0.12);
    --burgundy: #6d2348;
    --burgundy-light: #8b3a5e;
    --pink-soft: #f8dce5;
    --pink-softer: #fdf0f4;
    --pink-border: rgba(123,45,80,0.12);
    --text: #2d1b30;
    --text2: #8b6b7a;
    --text3: #b8949f;
    --card-q: #ffffff;
    --card-a: #fdf5f7;
    --radius: 18px;
    --radius-sm: 10px;
    --header-bg: linear-gradient(135deg, #7b2d50 0%, #a13d63 50%, #8b3a5e 100%);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Outfit', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 0 4rem;
    position: relative;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(123,45,80,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(123,45,80,0.03) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
    z-index: 0;
  }

  .top-header {
    width: 100%;
    background: var(--header-bg);
    padding: 18px 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
    z-index: 2;
    box-shadow: 0 2px 12px rgba(123,45,80,0.2);
    margin-bottom: 2rem;
  }

  .top-header .brand {
    font-family: 'DM Serif Display', serif;
    font-size: 22px;
    color: #fff;
    font-weight: 400;
  }

  .top-header .tag {
    font-size: 12px;
    color: rgba(255,255,255,0.7);
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }

  .wrapper {
    width: 100%;
    max-width: 640px;
    position: relative;
    z-index: 1;
    padding: 0 1rem;
  }

  header {
    margin-bottom: 2.5rem;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  header h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 28px;
    font-weight: 400;
    color: var(--burgundy);
  }

  header h1 em { font-style: italic; color: var(--accent2); }

  .stats { display: flex; gap: 12px; margin-bottom: 1.75rem; }

  .stat {
    background: #fff;
    border: 1px solid var(--pink-border);
    border-radius: var(--radius-sm);
    padding: 10px 16px;
    flex: 1;
    text-align: center;
  }

  .stat-value {
    font-family: 'DM Mono', monospace;
    font-size: 20px;
    font-weight: 500;
    color: var(--burgundy);
  }

  .stat-label {
    font-size: 11px;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .progress-wrap { margin-bottom: 1.75rem; display: flex; align-items: center; gap: 12px; }
  .progress-track { flex: 1; height: 4px; background: var(--pink-soft); border-radius: 4px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent2), var(--accent)); transition: width 0.4s ease; }
  .progress-text { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--text3); min-width: 52px; text-align: right; }

  .scene { width: 100%; height: 260px; perspective: 1100px; cursor: pointer; margin-bottom: 1rem; }
  .card { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.55s cubic-bezier(0.4, 0, 0.2, 1); }
  .card.flipped { transform: rotateY(180deg); }

  .face {
    position: absolute; inset: 0; backface-visibility: hidden; border-radius: var(--radius);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 2rem; text-align: center;
  }

  .face.front { background: var(--card-q); border: 1px solid var(--pink-border); }
  .face.back { transform: rotateY(180deg); background: var(--card-a); border: 1px solid rgba(123,45,80,0.15); }

  .face-badge {
    position: absolute; top: 16px; left: 20px; font-family: 'DM Mono', monospace; font-size: 10px;
    text-transform: uppercase; color: var(--text3); display: flex; align-items: center; gap: 5px;
  }

  .face-text { font-size: 18px; color: var(--text); line-height: 1.6; }
  .card-num { position: absolute; bottom: 16px; left: 20px; font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text3); }

  .controls { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; margin-bottom: 1.5rem; align-items: center; }
  .btn { padding: 12px 20px; border-radius: var(--radius-sm); border: 1px solid var(--pink-border); background: #fff; cursor: pointer; font-family: 'Outfit'; }
  .btn-flip { background: var(--accent-glow2); color: var(--accent); font-weight: 600; }
  .btn:disabled { opacity: 0.3; }

  .done-screen { display: none; text-align: center; padding: 3rem; background: #fff; border-radius: var(--radius); border: 1px solid var(--pink-border); }
  
  .kbd-hints { display: flex; gap: 16px; justify-content: center; font-size: 12px; color: var(--text3); margin-top: 1rem; }
  kbd { font-family: 'DM Mono'; padding: 2px 6px; border: 1px solid var(--pink-border); border-radius: 4px; background: #fff; }

  @keyframes cardIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
  .card-anim { animation: cardIn 0.3s ease; }
</style>
</head>
<body>

<div class="top-header">
  <div class="brand">SynaptiQ</div>
  <div class="tag">Graph Flashcards</div>
</div>

<div class="wrapper">
  <header>
    <h1>Breadth First <em>Search</em></h1>
    <p>10 specialized flashcards · Click card to flip</p>
  </header>

  <div class="stats">
    <div class="stat"><div class="stat-value" id="statCurrent">1</div><div class="stat-label">Current</div></div>
    <div class="stat"><div class="stat-value" id="statDone" style="color:var(--green)">0</div><div class="stat-label">Reviewed</div></div>
    <div class="stat"><div class="stat-value">10</div><div class="stat-label">Total</div></div>
  </div>

  <div class="progress-wrap">
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="progress-text" id="progressText">0 / 10</div>
  </div>

  <div class="scene" id="scene">
    <div class="card" id="card">
      <div class="face front">
        <div class="face-badge">Question</div>
        <div class="face-text" id="questionText"></div>
        <div class="card-num" id="cardNum"></div>
      </div>
      <div class="face back">
        <div class="face-badge">Answer</div>
        <div class="face-text" id="answerText"></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="btn" id="prevBtn" onclick="prev()">← Previous</button>
    <button class="btn btn-flip" onclick="flipCard()">Flip Card</button>
    <button class="btn" id="nextBtn" onclick="next()">Next →</button>
  </div>

  <div class="done-screen" id="doneScreen">
    <h2 style="font-family:'DM Serif Display'; color:var(--burgundy); margin-bottom:10px;">Module Complete!</h2>
    <p style="color:var(--text2); margin-bottom:20px;">You've mastered the fundamentals of BFS Algorithm.</p>
    <button class="btn btn-flip" onclick="restart()">↺ Start Over</button>
  </div>

  <div class="kbd-hints">
    <span><kbd>←</kbd> Prev</span>
    <span><kbd>→</kbd> Next</span>
    <span><kbd>Space</kbd> Flip</span>
  </div>
</div>

<script>
const DATA = [
  ["Which data structure is primarily used to implement Breadth First Search?", "A <strong>Queue</strong> (FIFO - First In, First Out)."],
  ["What is the standard Time Complexity of BFS for a graph with \\(V\\) vertices and \\(E\\) edges?", "\\(O(V + E)\\)"],
  ["What is the primary visual difference between BFS and DFS traversal?", "BFS explores the graph <strong>layer by layer</strong> (widely), whereas DFS explores as deep as possible first."],
  ["In an unweighted graph, what is the special property of the path found by BFS?", "It is guaranteed to be the <strong>shortest path</strong> from the source to any reachable node."],
  ["What is the Space Complexity of BFS in the worst case?", "\\(O(V)\\) <br><small>(All vertices might be stored in the queue at once)</small>"],
  ["In a Tree structure, what is the alternative name for a Breadth First Search traversal?", "<strong>Level-Order Traversal</strong>."],
  ["How does BFS handle cycles in a graph to prevent infinite loops?", "By using a <strong>Visited Array</strong> (or Set) to mark nodes as they are enqueued."],
  ["True or False: BFS can be used to find the shortest path in a graph with <em>weighted</em> edges.", "<strong>False</strong>. <br><small>(Dijkstra's Algorithm or BFS variations are required for weighted edges)</small>"],
  ["Name a real-world application of the BFS algorithm.", "Finding <strong>degrees of separation</strong> in social networks or GPS navigation for shortest unweighted paths."],
  ["Between BFS and DFS, which one typically uses more memory on a very wide but shallow tree?", "<strong>BFS</strong>. <br><small>(It must store all nodes of a level in the queue simultaneously)</small>"]
];

let cards = DATA.map((r, i) => ({ q: r[0], a: r[1] }));
let current = 0;
let reviewed = 0;

function renderCard() {
  if (current >= cards.length) {
    document.getElementById('scene').style.display = 'none';
    document.getElementById('doneScreen').style.display = 'block';
    return;
  }
  
  document.getElementById('scene').style.display = 'block';
  document.getElementById('doneScreen').style.display = 'none';
  
  const c = cards[current];
  const card = document.getElementById('card');
  card.classList.remove('flipped');
  card.classList.remove('card-anim');
  void card.offsetWidth; 
  card.classList.add('card-anim');

  document.getElementById('questionText').innerHTML = c.q;
  document.getElementById('answerText').innerHTML = c.a;
  document.getElementById('cardNum').textContent = `${current + 1} / ${cards.length}`;
  document.getElementById('statCurrent').textContent = current + 1;
  document.getElementById('statDone').textContent = reviewed;

  let pct = (reviewed / cards.length) * 100;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${reviewed} / ${cards.length}`;

  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').textContent = current === cards.length - 1 ? 'Finish ✓' : 'Next →';

  if (window.MathJax) MathJax.typesetPromise();
}

function flipCard() { document.getElementById('card').classList.toggle('flipped'); }
function next() { reviewed = Math.max(reviewed, current + 1); current++; renderCard(); }
function prev() { if (current > 0) { current--; renderCard(); } }
function restart() { current = 0; reviewed = 0; renderCard(); }

document.getElementById('scene').addEventListener('click', flipCard);
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') next();
  if (e.key === 'ArrowLeft') prev();
  if (e.key === ' ') { e.preventDefault(); flipCard(); }
});

renderCard();
</script>
</body>
</html>
