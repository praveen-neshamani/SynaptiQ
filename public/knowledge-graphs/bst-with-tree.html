<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BST Knowledge Graph - Tree Added</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0e0618;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }
    #container {
      position: relative;
      width: 100%;
      max-width: 800px;
      height: 600px;
    }
    canvas {
      border-radius: 12px;
      width: 100%;
      height: 100%;
      display: block;
    }
    .tooltip {
      position: absolute;
      background: rgba(0, 0, 0, 0.9);
      color: white;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
      z-index: 1000;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>
  <div id="container">
    <canvas id="c" width="800" height="600"></canvas>
    <div class="tooltip" id="tooltip"></div>
  </div>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const tooltip = document.getElementById('tooltip');
    const W = canvas.width, H = canvas.height;
    const cx = W / 2, cy = H / 2;
    const OUTER = Math.min(W, H) * 0.38;
    const MID = Math.min(W, H) * 0.21;

    // Stars
    const stars = Array.from({length: 200}, () => ({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.3 + 0.2,
      twinkle: Math.random() * Math.PI * 2,
      a: Math.random() * 0.7 + 0.2
    }));

    // Nodes
    const nodes = [
      { label: 'SynaptiQ', sub: 'hub', x: cx, y: cy, r: 22, type: 'hub', tooltip: 'Learning Hub' },
      { label: 'BFS', sub: '', angle: -Math.PI / 2, r: 18, type: 'main', status: 'completed', tooltip: 'Completed: Breadth-First Search' },
      { label: 'DFS', sub: '', angle: -Math.PI / 2 + 2.09, r: 18, type: 'main', status: 'completed', tooltip: 'Completed: Depth-First Search' },
      { label: 'BST', sub: '', angle: -Math.PI / 2 + 4.19, r: 18, type: 'main', status: 'current', tooltip: 'Current: Binary Search Tree' },
      { label: 'Tree', sub: '', angle: -Math.PI / 2 + 4.19, r: 14, type: 'fundamental', status: 'new', tooltip: 'Fundamentals: Tree Data Structure', scale: 0, flash: 1.0 },
    ];

    nodes.forEach(n => {
      if (n.angle !== undefined) {
        const rad = n.type === 'fundamental' ? MID : OUTER;
        n.x = cx + Math.cos(n.angle) * rad;
        n.y = cy + Math.sin(n.angle) * rad;
      }
      if (n.scale === undefined) n.scale = 1;
    });

    const hub = nodes[0];

    // Gold particles
    let particles = [];
    nodes.slice(1).forEach(n => {
      const col = n.type === 'fundamental' ? '245,158,11' : n.status === 'current' ? '16,185,129' : '192,132,252';
      for (let i = 0; i < 8; i++) {
        particles.push({
          t: i / 8,
          speed: 0.003 + Math.random() * 0.004,
          fx: hub.x, fy: hub.y,
          tx: n.x, ty: n.y,
          col, sz: Math.random() * 2 + 1
        });
      }
    });

    let frame = 0, ringAngle = 0;

    // Mouse tracking for tooltips
    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const mouseX = (e.clientX - rect.left) * scaleX;
      const mouseY = (e.clientY - rect.top) * scaleY;

      let found = false;
      nodes.forEach(n => {
        const dist = Math.sqrt((mouseX - n.x) ** 2 + (mouseY - n.y) ** 2);
        if (dist < n.r * n.scale) {
          tooltip.textContent = n.tooltip;
          tooltip.style.left = e.clientX + 10 + 'px';
          tooltip.style.top = e.clientY + 10 + 'px';
          tooltip.style.opacity = '1';
          found = true;
        }
      });

      if (!found) {
        tooltip.style.opacity = '0';
      }
    });

    function loop() {
      frame++;
      ringAngle += 0.003;
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = '#0e0618';
      ctx.fillRect(0, 0, W, H);

      // Nebula
      [[cx * 0.4, cy * 0.5, 140, 'rgba(142,53,99,0.08)'],
       [cx * 1.6, cy * 1.4, 110, 'rgba(99,60,142,0.07)'],
       [cx * 0.8, cy * 1.6, 100, 'rgba(142,53,99,0.06)'],
       [cx * 1.5, cy * 0.4, 90, 'rgba(192,132,252,0.07)']
      ].forEach(([x, y, r, c]) => {
        const g = ctx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, c);
        g.addColorStop(1, 'transparent');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
      });

      // Stars
      stars.forEach(s => {
        s.twinkle += 0.018;
        const a = s.a * (0.6 + 0.4 * Math.sin(s.twinkle));
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(200,160,220,${a})`;
        ctx.fill();
      });

      // Animated rings
      ctx.save();
      ctx.translate(cx, cy);

      // Outer ring
      ctx.rotate(ringAngle);
      ctx.beginPath();
      ctx.arc(0, 0, OUTER, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(192,132,252,0.55)';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([8, 6]);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.rotate(-ringAngle * 2);
      ctx.beginPath();
      ctx.arc(0, 0, OUTER, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(216,180,254,0.25)';
      ctx.lineWidth = 0.8;
      ctx.setLineDash([2, 10]);
      ctx.stroke();
      ctx.setLineDash([]);

      // Inner ring
      ctx.rotate(ringAngle * 1.5);
      ctx.beginPath();
      ctx.arc(0, 0, MID, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(245,158,11,0.55)';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([6, 5]);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.rotate(-ringAngle * 0.5);
      ctx.beginPath();
      ctx.arc(0, 0, MID, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255,255,255,0.12)';
      ctx.lineWidth = 0.8;
      ctx.setLineDash([2, 8]);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.rotate(ringAngle);
      ctx.beginPath();
      ctx.arc(0, 0, OUTER * 1.18, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(142,53,99,0.2)';
      ctx.lineWidth = 0.8;
      ctx.setLineDash([3, 12]);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.restore();

      // Animate scale and flash
      nodes.forEach(n => {
        if (n.scale < 1) n.scale = Math.min(1, n.scale + 0.06);
        if (n.flash > 0) n.flash = Math.max(0, n.flash - 0.015);
      });

      // Spokes
      nodes.slice(1).forEach(n => {
        ctx.beginPath();
        ctx.moveTo(hub.x, hub.y);
        ctx.lineTo(n.x, n.y);
        ctx.strokeStyle = n.type === 'fundamental' ? 'rgba(245,158,11,0.45)' : n.status === 'current' ? 'rgba(16,185,129,0.35)' : 'rgba(192,132,252,0.18)';
        ctx.lineWidth = 1;
        ctx.setLineDash(n.type === 'fundamental' ? [4, 4] : []);
        ctx.stroke();
        ctx.setLineDash([]);
      });

      // Gold particles
      particles.forEach(p => {
        p.t += p.speed;
        if (p.t > 1) p.t -= 1;
        const x = p.fx + (p.tx - p.fx) * p.t;
        const y = p.fy + (p.ty - p.fy) * p.t;
        const fade = Math.sin(p.t * Math.PI);
        
        ctx.beginPath();
        ctx.arc(x, y, p.sz, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${p.col},${fade * 0.95})`;
        ctx.fill();
        
        const tx2 = p.fx + (p.tx - p.fx) * Math.max(0, p.t - 0.06);
        const ty2 = p.fy + (p.ty - p.fy) * Math.max(0, p.t - 0.06);
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(tx2, ty2);
        ctx.strokeStyle = `rgba(${p.col},${fade * 0.4})`;
        ctx.lineWidth = p.sz * 0.9;
        ctx.stroke();
      });

      // Nodes
      nodes.forEach(n => {
        ctx.save();
        ctx.translate(n.x, n.y);
        ctx.scale(n.scale, n.scale);

        // Current node pulse
        if (n.status === 'current') {
          const pulse = Math.sin(frame * 0.05) * 6;
          const g = ctx.createRadialGradient(0, 0, n.r, 0, 0, n.r + 20 + pulse);
          g.addColorStop(0, 'rgba(16,185,129,0.4)');
          g.addColorStop(1, 'rgba(16,185,129,0)');
          ctx.beginPath();
          ctx.arc(0, 0, n.r + 20 + pulse, 0, Math.PI * 2);
          ctx.fillStyle = g;
          ctx.fill();
        }

        // Hub glow
        if (n.type === 'hub') {
          const g = ctx.createRadialGradient(0, 0, n.r, 0, 0, n.r + 22);
          g.addColorStop(0, 'rgba(142,53,99,0.35)');
          g.addColorStop(1, 'rgba(142,53,99,0)');
          ctx.beginPath();
          ctx.arc(0, 0, n.r + 22, 0, Math.PI * 2);
          ctx.fillStyle = g;
          ctx.fill();
        }

        // Flash for new fundamental
        if (n.type === 'fundamental' && n.flash > 0) {
          const g = ctx.createRadialGradient(0, 0, n.r, 0, 0, n.r + 16);
          g.addColorStop(0, `rgba(245,158,11,${n.flash * 0.6})`);
          g.addColorStop(1, 'rgba(245,158,11,0)');
          ctx.beginPath();
          ctx.arc(0, 0, n.r + 16, 0, Math.PI * 2);
          ctx.fillStyle = g;
          ctx.fill();
        }

        // Node circle
        ctx.beginPath();
        ctx.arc(0, 0, n.r, 0, Math.PI * 2);
        ctx.fillStyle = n.type === 'hub' ? '#3d1a2e' : n.type === 'fundamental' ? '#2d1a05' : n.status === 'current' ? '#064e3b' : '#1e1040';
        ctx.fill();

        // Node border
        ctx.beginPath();
        ctx.arc(0, 0, n.r, 0, Math.PI * 2);
        ctx.strokeStyle = n.type === 'hub' ? '#c084fc' : n.type === 'fundamental' ? '#f59e0b' : n.status === 'current' ? '#10b981' : '#7c3aed';
        ctx.lineWidth = n.type === 'fundamental' || n.status === 'current' ? 2.5 : 1.5;
        ctx.stroke();

        // Label
        const maxW = n.r * 1.75;
        let fs = n.type === 'fundamental' ? 8 : 9;
        ctx.font = `600 ${fs}px 'Segoe UI', sans-serif`;
        while (ctx.measureText(n.label).width > maxW && fs > 5) {
          fs--;
          ctx.font = `600 ${fs}px 'Segoe UI', sans-serif`;
        }
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = n.type === 'hub' ? '#e9d5ff' : n.type === 'fundamental' ? '#fef3c7' : n.status === 'current' ? '#d1fae5' : '#ddd6fe';
        ctx.fillText(n.label, 0, n.sub ? -4 : 0);

        if (n.sub) {
          ctx.font = `400 ${Math.max(fs - 1, 5)}px 'Segoe UI', sans-serif`;
          ctx.fillStyle = n.status === 'current' ? '#6ee7b7' : n.type === 'fundamental' ? '#fde68a' : '#a78bfa';
          ctx.fillText(n.sub, 0, 5);
        }

        // Status indicator
        if (n.status === 'current') {
          ctx.font = 'bold 7px sans-serif';
          ctx.fillStyle = '#10b981';
          ctx.fillText('▶ now', 0, n.r + 11);
        }

        // New fundamental indicator
        if (n.type === 'fundamental' && n.flash > 0.1) {
          ctx.font = 'bold 7px sans-serif';
          ctx.fillStyle = '#f59e0b';
          ctx.fillText('new!', 0, -(n.r + 11));
        }

        ctx.restore();
      });

      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
