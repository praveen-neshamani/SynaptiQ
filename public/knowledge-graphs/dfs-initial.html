<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DFS Knowledge Graph - Initial</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0e0618;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }
    canvas { border-radius: 12px; width: 100%; max-width: 800px; height: 600px; display: block; }
    .tooltip {
      position: absolute;
      background: rgba(0, 0, 0, 0.9);
      color: white;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
      z-index: 1000;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>
  <canvas id="c" width="800" height="600"></canvas>
  <div class="tooltip" id="tooltip"></div>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const tooltip = document.getElementById('tooltip');
    const W = canvas.width, H = canvas.height;
    const cx = W / 2, cy = H / 2;
    const OUTER = Math.min(W, H) * 0.38;
    const MID = Math.min(W, H) * 0.21;

    const stars = Array.from({length: 200}, () => ({
      x: Math.random() * W, y: Math.random() * H,
      r: Math.random() * 1.3 + 0.2,
      twinkle: Math.random() * Math.PI * 2,
      a: Math.random() * 0.7 + 0.2
    }));

    const nodes = [
      { label: 'SynaptiQ', sub: 'hub', x: cx, y: cy, r: 22, type: 'hub', tooltip: 'Learning Hub' },
      { label: 'BFS', sub: '', angle: -Math.PI / 2, r: 18, type: 'main', status: 'completed', tooltip: 'Completed: Breadth-First Search' },
      { label: 'DFS', sub: '', angle: -Math.PI / 2 + 2.09, r: 18, type: 'main', status: 'current', tooltip: 'Current: Depth-First Search' },
      { label: 'BST', sub: '', angle: -Math.PI / 2 + 4.19, r: 18, type: 'main', status: 'upcoming', tooltip: 'Upcoming: Binary Search Tree' },
    ];

    nodes.forEach(n => {
      if (n.angle !== undefined) {
        n.x = cx + Math.cos(n.angle) * OUTER;
        n.y = cy + Math.sin(n.angle) * OUTER;
      }
      n.scale = 1;
    });

    const hub = nodes[0];
    let particles = [];
    nodes.slice(1).forEach(n => {
      const col = n.status === 'current' ? '16,185,129' : '192,132,252';
      for (let i = 0; i < 8; i++) {
        particles.push({
          t: i / 8, speed: 0.003 + Math.random() * 0.004,
          fx: hub.x, fy: hub.y, tx: n.x, ty: n.y,
          col, sz: Math.random() * 2 + 1
        });
      }
    });

    let frame = 0, ringAngle = 0;

    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const mouseX = (e.clientX - rect.left) * scaleX;
      const mouseY = (e.clientY - rect.top) * scaleY;

      let found = false;
      nodes.forEach(n => {
        const dist = Math.sqrt((mouseX - n.x) ** 2 + (mouseY - n.y) ** 2);
        if (dist < n.r) {
          tooltip.textContent = n.tooltip;
          tooltip.style.left = e.clientX + 10 + 'px';
          tooltip.style.top = e.clientY + 10 + 'px';
          tooltip.style.opacity = '1';
          found = true;
        }
      });
      if (!found) tooltip.style.opacity = '0';
    });

    function loop() {
      frame++; ringAngle += 0.003;
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = '#0e0618'; ctx.fillRect(0, 0, W, H);

      [[cx * 0.4, cy * 0.5, 140, 'rgba(142,53,99,0.08)'],
       [cx * 1.6, cy * 1.4, 110, 'rgba(99,60,142,0.07)'],
       [cx * 0.8, cy * 1.6, 100, 'rgba(142,53,99,0.06)'],
       [cx * 1.5, cy * 0.4, 90, 'rgba(192,132,252,0.07)']
      ].forEach(([x, y, r, c]) => {
        const g = ctx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, c); g.addColorStop(1, 'transparent');
        ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      });

      stars.forEach(s => {
        s.twinkle += 0.018;
        const a = s.a * (0.6 + 0.4 * Math.sin(s.twinkle));
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(200,160,220,${a})`; ctx.fill();
      });

      ctx.save(); ctx.translate(cx, cy);
      ctx.rotate(ringAngle);
      ctx.beginPath(); ctx.arc(0, 0, OUTER, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(192,132,252,0.55)'; ctx.lineWidth = 1.5;
      ctx.setLineDash([8, 6]); ctx.stroke(); ctx.setLineDash([]);

      ctx.rotate(-ringAngle * 2);
      ctx.beginPath(); ctx.arc(0, 0, OUTER, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(216,180,254,0.25)'; ctx.lineWidth = 0.8;
      ctx.setLineDash([2, 10]); ctx.stroke(); ctx.setLineDash([]);

      ctx.rotate(ringAngle * 1.5);
      ctx.beginPath(); ctx.arc(0, 0, MID, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(245,158,11,0.55)'; ctx.lineWidth = 1.5;
      ctx.setLineDash([6, 5]); ctx.stroke(); ctx.setLineDash([]);

      ctx.rotate(-ringAngle * 0.5);
      ctx.beginPath(); ctx.arc(0, 0, MID, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 0.8;
      ctx.setLineDash([2, 8]); ctx.stroke(); ctx.setLineDash([]);

      ctx.rotate(ringAngle);
      ctx.beginPath(); ctx.arc(0, 0, OUTER * 1.18, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(142,53,99,0.2)'; ctx.lineWidth = 0.8;
      ctx.setLineDash([3, 12]); ctx.stroke(); ctx.setLineDash([]);
      ctx.restore();

      nodes.slice(1).forEach(n => {
        ctx.beginPath(); ctx.moveTo(hub.x, hub.y); ctx.lineTo(n.x, n.y);
        ctx.strokeStyle = n.status === 'current' ? 'rgba(16,185,129,0.35)' : 'rgba(192,132,252,0.18)';
        ctx.lineWidth = 1; ctx.stroke();
      });

      particles.forEach(p => {
        p.t += p.speed; if (p.t > 1) p.t -= 1;
        const x = p.fx + (p.tx - p.fx) * p.t;
        const y = p.fy + (p.ty - p.fy) * p.t;
        const fade = Math.sin(p.t * Math.PI);
        ctx.beginPath(); ctx.arc(x, y, p.sz, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${p.col},${fade * 0.95})`; ctx.fill();
      });

      nodes.forEach(n => {
        ctx.save(); ctx.translate(n.x, n.y);

        if (n.status === 'current') {
          const pulse = Math.sin(frame * 0.05) * 6;
          const g = ctx.createRadialGradient(0, 0, n.r, 0, 0, n.r + 20 + pulse);
          g.addColorStop(0, 'rgba(16,185,129,0.4)'); g.addColorStop(1, 'rgba(16,185,129,0)');
          ctx.beginPath(); ctx.arc(0, 0, n.r + 20 + pulse, 0, Math.PI * 2);
          ctx.fillStyle = g; ctx.fill();
        }

        if (n.type === 'hub') {
          const g = ctx.createRadialGradient(0, 0, n.r, 0, 0, n.r + 22);
          g.addColorStop(0, 'rgba(142,53,99,0.35)'); g.addColorStop(1, 'rgba(142,53,99,0)');
          ctx.beginPath(); ctx.arc(0, 0, n.r + 22, 0, Math.PI * 2);
          ctx.fillStyle = g; ctx.fill();
        }

        ctx.beginPath(); ctx.arc(0, 0, n.r, 0, Math.PI * 2);
        ctx.fillStyle = n.type === 'hub' ? '#3d1a2e' : n.status === 'current' ? '#064e3b' : '#1e1040';
        ctx.fill();

        ctx.beginPath(); ctx.arc(0, 0, n.r, 0, Math.PI * 2);
        ctx.strokeStyle = n.type === 'hub' ? '#c084fc' : n.status === 'current' ? '#10b981' : '#7c3aed';
        ctx.lineWidth = n.status === 'current' ? 2.5 : 1.5; ctx.stroke();

        ctx.font = '600 9px Segoe UI, sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = n.type === 'hub' ? '#e9d5ff' : n.status === 'current' ? '#d1fae5' : '#ddd6fe';
        ctx.fillText(n.label, 0, 0);

        if (n.status === 'current') {
          ctx.font = 'bold 7px sans-serif'; ctx.fillStyle = '#10b981';
          ctx.fillText('▶ now', 0, n.r + 11);
        }

        ctx.restore();
      });

      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
