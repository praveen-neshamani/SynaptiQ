<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SynaptiQ | BST Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --porcelain: #FFFEFC;
            --deep-pink: #8e3563;
            --soft-pink: #fceef5;
            --accent-pink: #d65a92;
            --btn-green: #28a745;
            --btn-red: #dc3545;
            --text-dark: #2d1b24;
            --card-shadow: 0 20px 40px rgba(142, 53, 99, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--porcelain);
            color: var(--text-dark);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        nav {
            background: var(--deep-pink);
            padding: 0 5%;
            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            z-index: 1000;
            flex-shrink: 0;
        }

        .nav-left { font-weight: 800; font-size: 1.4rem; letter-spacing: -0.5px; }
        .nav-right { font-weight: 400; font-size: 0.85rem; opacity: 0.9; letter-spacing: 1.5px; text-transform: uppercase; }

        main {
            display: flex;
            flex: 1;
            padding: 20px;
            gap: 20px;
            height: calc(100vh - 60px);
        }

        .simulator-section {
            flex: 0 0 60%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .simulator-card {
            flex: 1;
            background: white;
            border-radius: 24px;
            box-shadow: var(--card-shadow);
            border: 1px solid rgba(142, 53, 99, 0.05);
            padding: 20px;
            display: flex;
            flex-direction: column;
            position: relative;
            background-image: radial-gradient(var(--soft-pink) 1px, transparent 1px);
            background-size: 30px 30px;
            overflow: hidden;
        }

        .controls {
            display: flex;
            gap: 8px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            justify-content: center;
            border: 1px solid var(--soft-pink);
            flex-wrap: wrap;
        }

        input {
            padding: 10px 15px;
            border: 2px solid var(--soft-pink);
            border-radius: 10px;
            width: 70px;
            outline: none;
            font-weight: 700;
        }

        button {
            padding: 10px 14px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            color: white;
            transition: all 0.3s ease;
            font-size: 0.75rem;
        }

        .btn-insert { background: var(--btn-green); }
        .btn-delete { background: var(--btn-red); }
        .btn-algo { background: var(--accent-pink); }
        .btn-reset { background: #6c757d; }

        button:hover { transform: translateY(-2px); filter: brightness(1.1); }
        button:disabled { opacity: 0.4; cursor: not-allowed; }

        #canvas-container { flex: 1; width: 100%; height: 100%; position: relative; }
        svg { width: 100%; height: 100%; display: block; }

        .log-section {
            flex: 1;
            background: var(--soft-pink);
            border-radius: 24px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(142, 53, 99, 0.1);
        }

        .log-header h2 { font-size: 1.8rem; color: var(--deep-pink); font-weight: 800; }
        .log-header p { font-size: 0.9rem; opacity: 0.7; margin-top: 5px; }

        .sequence-box {
            flex: 1;
            background: white;
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.02);
            overflow-y: auto;
        }

        .sequence-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent-pink);
            font-weight: 800;
        }

        #traversalSequence {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--deep-pink);
            line-height: 1.4;
        }

        .complexity-grid { display: flex; gap: 12px; margin-top: 10px; }
        .complexity-card {
            flex: 1;
            background: #fffafa;
            border: 1px dashed var(--accent-pink);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
        }
        .complexity-val { font-size: 1.1rem; font-weight: 800; color: var(--deep-pink); }

        /* Node Styling */
        .node-circle { fill: white; stroke: var(--deep-pink); stroke-width: 2.5; transition: 0.4s; }
        .node-text { fill: var(--text-dark); font-weight: 800; font-size: 14px; pointer-events: none; }
        .edge-line { stroke: var(--deep-pink); stroke-width: 2; opacity: 0.2; }
        .visited-node { fill: var(--deep-pink) !important; }
        .visited-text { fill: white !important; }

        #traveller { fill: #FFD700; filter: drop-shadow(0 0 8px #FFD700); transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1); }

        .legend { margin-top: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 0.8rem; }
        .legend-item { display: flex; align-items: center; gap: 8px; font-weight: 600; color: var(--deep-pink); }
        .dot { width: 10px; height: 10px; border-radius: 50%; }

    </style>
</head>
<body>

    <nav>
        <div class="nav-left">SynaptiQ</div>
        <div class="nav-right">BST Traversal Simulator</div>
    </nav>

    <main>
        <section class="simulator-section">
            <div class="controls">
                <input type="number" id="nodeValue" placeholder="Val">
                <button class="btn-insert" onclick="handleAdd()">Insert</button>
                <button class="btn-delete" onclick="handleDelete()">Delete</button>
                <button class="btn-algo" onclick="startTraversal('preorder')">Preorder</button>
                <button class="btn-algo" onclick="startTraversal('inorder')">Inorder</button>
                <button class="btn-algo" onclick="startTraversal('postorder')">Postorder</button>
                <button class="btn-reset" onclick="resetTree()">Reset</button>
            </div>
            
            <div class="simulator-card">
                <div id="canvas-container">
                    <svg id="treeSvg">
                        <g id="edgesGroup"></g>
                        <g id="nodesGroup"></g>
                        <circle id="traveller" r="10" style="display:none;"></circle>
                    </svg>
                </div>
            </div>
        </section>

        <section class="log-section">
            <div class="log-header">
                <h2 id="logTitle">Algorithm Output</h2>
                <p>Tree state and traversal path</p>
            </div>

            <div class="sequence-box">
                <div class="sequence-label" id="currentTraversalLabel">Sequence</div>
                <div id="traversalSequence">—</div>
                
                <div class="complexity-grid">
                    <div class="complexity-card">
                        <div class="sequence-label">Time</div>
                        <div class="complexity-val">O(N)</div>
                    </div>
                    <div class="complexity-card">
                        <div class="sequence-label">Space</div>
                        <div class="complexity-val">O(H)</div>
                    </div>
                </div>

                <div style="flex:1"></div>

                <div class="sequence-label">Legend</div>
                <div class="legend">
                    <div class="legend-item"><div class="dot" style="background:var(--btn-green)"></div> Add</div>
                    <div class="legend-item"><div class="dot" style="background:var(--btn-red)"></div> Delete</div>
                    <div class="legend-item"><div class="dot" style="background:var(--accent-pink)"></div> Visited</div>
                    <div class="legend-item"><div class="dot" style="background:#FFD700"></div> Cursor</div>
                </div>
            </div>
        </section>
    </main>

    <script>
        class Node {
            constructor(val) {
                this.val = val;
                this.left = null;
                this.right = null;
                this.x = 0;
                this.y = 0;
            }
        }

        let root = null;
        const svg = document.getElementById('treeSvg');
        const nodesGroup = document.getElementById('nodesGroup');
        const edgesGroup = document.getElementById('edgesGroup');
        const traveller = document.getElementById('traveller');
        const logDisplay = document.getElementById('traversalSequence');

        // Robust Render with fallback for zero-width containers
        function render() {
            nodesGroup.innerHTML = '';
            edgesGroup.innerHTML = '';
            if (!root) return;

            const width = svg.clientWidth || 800; // fallback if clientWidth is 0
            const height = svg.clientHeight || 500;
            
            updatePositions(root, width / 2, 60, width / 4);
            drawTree(root);
        }

        function updatePositions(node, x, y, horizSpace) {
            if (!node) return;
            node.x = x;
            node.y = y;
            updatePositions(node.left, x - horizSpace, y + 80, horizSpace / 2);
            updatePositions(node.right, x + horizSpace, y + 80, horizSpace / 2);
        }

        function drawTree(node) {
            if (node.left) {
                createEdge(node.x, node.y, node.left.x, node.left.y);
                drawTree(node.left);
            }
            if (node.right) {
                createEdge(node.x, node.y, node.right.x, node.right.y);
                drawTree(node.right);
            }
            createNode(node.x, node.y, node.val);
        }

        function createNode(x, y, val) {
            const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
            const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            circle.setAttribute("cx", x); circle.setAttribute("cy", y);
            circle.setAttribute("r", 22);
            circle.setAttribute("class", "node-circle");
            circle.setAttribute("id", `n-${val}`);

            const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
            text.setAttribute("x", x); text.setAttribute("y", y + 5);
            text.setAttribute("text-anchor", "middle");
            text.setAttribute("class", "node-text");
            text.setAttribute("id", `t-${val}`);
            text.textContent = val;

            g.appendChild(circle);
            g.appendChild(text);
            nodesGroup.appendChild(g);
        }

        function createEdge(x1, y1, x2, y2) {
            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute("x1", x1); line.setAttribute("y1", y1);
            line.setAttribute("x2", x2); line.setAttribute("y2", y2);
            line.setAttribute("class", "edge-line");
            edgesGroup.appendChild(line);
        }

        function insert(node, val) {
            if (!node) return new Node(val);
            if (val < node.val) node.left = insert(node.left, val);
            else if (val > node.val) node.right = insert(node.right, val);
            return node;
        }

        function deleteNode(node, val) {
            if (!node) return null;
            if (val < node.val) node.left = deleteNode(node.left, val);
            else if (val > node.val) node.right = deleteNode(node.right, val);
            else {
                if (!node.left) return node.right;
                if (!node.right) return node.left;
                let min = node.right;
                while (min.left) min = min.left;
                node.val = min.val;
                node.right = deleteNode(node.right, min.val);
            }
            return node;
        }

        function handleAdd() {
            const val = parseInt(document.getElementById('nodeValue').value);
            if (isNaN(val)) return;
            root = insert(root, val);
            render();
            document.getElementById('nodeValue').value = '';
        }

        function handleDelete() {
            const val = parseInt(document.getElementById('nodeValue').value);
            if (isNaN(val)) return;
            root = deleteNode(root, val);
            render();
            document.getElementById('nodeValue').value = '';
        }

        async function startTraversal(type) {
            if (!root) return;
            const buttons = document.querySelectorAll('button');
            buttons.forEach(b => b.disabled = true);
            
            document.querySelectorAll('.node-circle').forEach(el => el.classList.remove('visited-node'));
            document.querySelectorAll('.node-text').forEach(el => el.classList.remove('visited-text'));
            logDisplay.textContent = "";

            const sequence = [];
            if (type === 'preorder') {
                const pre = (n) => { if(!n) return; sequence.push(n); pre(n.left); pre(n.right); };
                pre(root);
            } else if (type === 'inorder') {
                const ino = (n) => { if(!n) return; ino(n.left); sequence.push(n); ino(n.right); };
                ino(root);
            } else {
                const post = (n) => { if(!n) return; post(n.left); post(n.right); sequence.push(n); };
                post(root);
            }

            traveller.style.display = "block";
            for (let node of sequence) {
                traveller.setAttribute("cx", node.x);
                traveller.setAttribute("cy", node.y);
                await new Promise(r => setTimeout(r, 600));

                document.getElementById(`n-${node.val}`).classList.add('visited-node');
                document.getElementById(`t-${node.val}`).classList.add('visited-text');
                logDisplay.textContent += (logDisplay.textContent ? " → " : "") + node.val;
                await new Promise(r => setTimeout(r, 200));
            }

            setTimeout(() => {
                traveller.style.display = "none";
                buttons.forEach(b => b.disabled = false);
            }, 800);
        }

        function resetTree() {
            root = null;
            render();
            logDisplay.textContent = "—";
            traveller.style.display = "none";
        }

        // Initialize and ensure render
        window.onload = () => {
            [50, 30, 70, 20, 40, 60, 85].forEach(v => root = insert(root, v));
            // Slight delay ensures the browser has calculated widths
            setTimeout(render, 100);
        };

        window.onresize = render;
    </script>
</body>
</html>
